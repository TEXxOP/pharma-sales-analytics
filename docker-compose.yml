services:
  postgres:
    image: postgres:15-alpine
    container_name: pharma-postgres
    environment:
      POSTGRES_DB: pharma_analytics
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5434:5432"
    volumes:
      - pharma_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pharma_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pharma_data:
    driver: local
